
workflow_yml = """name: Jericho Beach Wind Alert

on:
  schedule:
    # Runs every day at 7:00 AM and 4:00 PM Pacific (14:00 and 23:00 UTC)
    - cron: '0 14 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:  # Allows you to manually trigger from GitHub

jobs:
  check-wind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run wind check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_wind.py
"""

# Write to a file for download
import os
os.makedirs(".github/workflows", exist_ok=True)
with open(".github/workflows/wind_alert.yml", "w") as f:
    f.write(workflow_yml.strip())

print(workflow_yml.strip())

