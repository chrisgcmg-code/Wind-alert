name: Jericho Beach Wind Alert

on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: wind-alert
  cancel-in-progress: false

jobs:
  check-wind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}
      - name: Install (cache miss only)
        run: |
          if [ ! -d .venv ]; then
            python -m venv .venv
            .venv/bin/pip install -r requirements.txt
          fi
      - name: Run wind check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: .venv/bin/python -u check_wind.py
