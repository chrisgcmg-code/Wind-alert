name: Jericho Beach Wind Alert

on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  check-wind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Verify script exists
        run: |
          echo "=== FILES IN REPO ==="
          ls -la
          echo "=== FIRST 5 LINES OF check_wind.py ==="
          head -5 check_wind.py
      - name: Run wind check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "Starting wind check script..."
          python check_wind.py 2>&1
          echo "Script finished with exit code $?"
